name: Bug report
description: Something is broken
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: main @ abc1234
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth / spaces
        - Ledger
        - Budgets
        - Import / banking
        - PWA / notifications
        - Other
