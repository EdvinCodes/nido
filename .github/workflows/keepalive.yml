name: Keepalive

# Pings /api/health every two days so a free-tier Supabase project never pauses from inactivity.
# See docs/01-ARCHITECTURE.md §10.

on:
  schedule:
    - cron: '0 12 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          set -euo pipefail
          url="${{ vars.KEEPALIVE_URL }}"
          if [ -z "$url" ]; then
            echo "KEEPALIVE_URL repository variable is not set — skipping."
            exit 0
          fi
          curl --fail --retry 3 --retry-delay 5 "$url/api/health"
